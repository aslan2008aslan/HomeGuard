<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#0d1117" rx="8"/>

  <!-- Title -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#e2e8f0" text-anchor="middle">HomeGuard System Architecture</text>

  <!-- Brain (LLM) -->
  <circle cx="400" cy="100" r="40" fill="#2b6cb0" opacity="0.8"/>
  <text x="400" y="95" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">LLM</text>
  <text x="400" y="112" font-family="Arial, sans-serif" font-size="10" fill="#bee3f8" text-anchor="middle">Brain</text>

  <!-- Cerebellum (AGH) -->
  <rect x="280" y="160" width="240" height="60" fill="#553c9a" rx="8" opacity="0.8"/>
  <text x="400" y="185" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Agnes Harness</text>
  <text x="400" y="205" font-family="Arial, sans-serif" font-size="11" fill="#d6bcfa" text-anchor="middle">Memory + Execution Runtime</text>

  <!-- AgnesHub -->
  <rect x="300" y="240" width="200" height="45" fill="#2c5282" rx="6" opacity="0.8"/>
  <text x="400" y="268" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle">AgnesHub (:4180)</text>

  <!-- Connection lines -->
  <line x1="400" y1="140" x2="400" y2="160" stroke="#718096" stroke-width="2"/>
  <line x1="400" y1="220" x2="400" y2="240" stroke="#718096" stroke-width="2"/>

  <!-- Device (MHS) -->
  <rect x="560" y="240" width="200" height="45" fill="#276749" rx="6" opacity="0.8"/>
  <text x="660" y="260" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">TurboPi</text>
  <text x="660" y="278" font-family="Arial, sans-serif" font-size="10" fill="#c6f6d5" text-anchor="middle">MHS Device</text>

  <!-- WebSocket arrow -->
  <line x1="500" y1="262" x2="560" y2="262" stroke="#f6ad55" stroke-width="2" stroke-dasharray="6,3"/>
  <polygon points="555,257 565,262 555,267" fill="#f6ad55"/>
  <text x="530" y="255" font-family="Arial, sans-serif" font-size="9" fill="#f6ad55" text-anchor="middle">WS</text>

  <!-- Device capabilities -->
  <rect x="560" y="300" width="95" height="35" fill="#1a4731" rx="4" opacity="0.8"/>
  <text x="607" y="322" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">drive / turn</text>

  <rect x="665" y="300" width="95" height="35" fill="#1a4731" rx="4" opacity="0.8"/>
  <text x="712" y="322" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">camera</text>

  <rect x="560" y="345" width="95" height="35" fill="#1a4731" rx="4" opacity="0.8"/>
  <text x="607" y="367" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">halt / say</text>

  <rect x="665" y="345" width="95" height="35" fill="#1a4731" rx="4" opacity="0.8"/>
  <text x="712" y="367" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">pose / mic</text>

  <!-- Labels -->
  <text x="100" y="100" font-family="Arial, sans-serif" font-size="11" fill="#a0aec0" text-anchor="middle">DeepSeek V4.1</text>
  <text x="100" y="116" font-family="Arial, sans-serif" font-size="11" fill="#a0aec0" text-anchor="middle">Flash (1M ctx)</text>

  <!-- Legend -->
  <rect x="30" y="340" width="15" height="15" fill="#2b6cb0" rx="2"/>
  <text x="52" y="352" font-family="Arial, sans-serif" font-size="10" fill="#a0aec0">LLM / Brain</text>

  <rect x="30" y="362" width="15" height="15" fill="#553c9a" rx="2"/>
  <text x="52" y="374" font-family="Arial, sans-serif" font-size="10" fill="#a0aec0">AGH / Memory</text>

  <rect x="150" y="340" width="15" height="15" fill="#276749" rx="2"/>
  <text x="172" y="352" font-family="Arial, sans-serif" font-size="10" fill="#a0aec0">Device / Body</text>

  <line x1="150" y1="370" x2="165" y2="370" stroke="#f6ad55" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="172" y="374" font-family="Arial, sans-serif" font-size="10" fill="#a0aec0">WebSocket</text>
</svg>
