<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="thumbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a202c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d3748;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="200" fill="url(#thumbGrad)" rx="12"/>

  <!-- Play button -->
  <circle cx="400" cy="90" r="35" fill="none" stroke="#f6ad55" stroke-width="3"/>
  <polygon points="390,72 390,108 418,90" fill="#f6ad55"/>

  <!-- Text -->
  <text x="400" y="150" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e2e8f0" text-anchor="middle">Demo Videos on Bilibili</text>
  <text x="400" y="175" font-family="Arial, sans-serif" font-size="12" fill="#a0aec0" text-anchor="middle">4 videos: autonomous inspection, visual reasoning, navigation, failure recovery</text>
</svg>
