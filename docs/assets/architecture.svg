<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="hostGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d3748;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a202c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="devGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#22543d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a3a2a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="#0d1117" rx="8"/>

  <!-- Host side -->
  <rect x="30" y="30" width="320" height="340" fill="url(#hostGrad)" rx="8" stroke="#4a5568" stroke-width="1"/>
  <text x="190" y="60" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e2e8f0" text-anchor="middle">Host (Windows PC)</text>

  <rect x="50" y="80" width="280" height="50" fill="#2b6cb0" rx="6" opacity="0.8"/>
  <text x="190" y="110" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">Agnes Harness + LLM</text>

  <rect x="50" y="145" width="280" height="50" fill="#2c5282" rx="6" opacity="0.8"/>
  <text x="190" y="175" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">AgnesHub (:4180)</text>

  <rect x="50" y="210" width="280" height="50" fill="#2a4365" rx="6" opacity="0.8"/>
  <text x="190" y="240" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">Devices Panel (Web)</text>

  <text x="190" y="290" font-family="Arial, sans-serif" font-size="12" fill="#a0aec0" text-anchor="middle">DeepSeek V4.1 Flash (1M context)</text>
  <text x="190" y="310" font-family="Arial, sans-serif" font-size="12" fill="#a0aec0" text-anchor="middle">Task Planning + Visual Reasoning</text>

  <!-- Device side -->
  <rect x="450" y="30" width="320" height="340" fill="url(#devGrad)" rx="8" stroke="#48bb78" stroke-width="1"/>
  <text x="610" y="60" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#c6f6d5" text-anchor="middle">Device (TurboPi / RPi 5)</text>

  <rect x="470" y="80" width="280" height="50" fill="#276749" rx="6" opacity="0.8"/>
  <text x="610" y="110" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">turpi_device.py (MHS)</text>

  <rect x="470" y="145" width="280" height="50" fill="#22543d" rx="6" opacity="0.8"/>
  <text x="610" y="175" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">ROS2 Humble (Docker)</text>

  <rect x="470" y="210" width="130" height="50" fill="#1a4731" rx="6" opacity="0.8"/>
  <text x="535" y="240" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">mecanum_chassis</text>

  <rect x="620" y="210" width="130" height="50" fill="#1a4731" rx="6" opacity="0.8"/>
  <text x="685" y="240" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">usb_cam</text>

  <text x="610" y="290" font-family="Arial, sans-serif" font-size="12" fill="#9ae6b4" text-anchor="middle">7 Tools: drive, turn, change_view,</text>
  <text x="610" y="308" font-family="Arial, sans-serif" font-size="12" fill="#9ae6b4" text-anchor="middle">aim_camera, halt, say, listen</text>
  <text x="610" y="330" font-family="Arial, sans-serif" font-size="12" fill="#9ae6b4" text-anchor="middle">3 Sources: front, pose, mic</text>

  <!-- Connection arrow -->
  <line x1="350" y1="170" x2="450" y2="170" stroke="#f6ad55" stroke-width="3" stroke-dasharray="8,4"/>
  <polygon points="445,164 455,170 445,176" fill="#f6ad55"/>
  <text x="400" y="158" font-family="Arial, sans-serif" font-size="11" fill="#f6ad55" text-anchor="middle">Outbound</text>
  <text x="400" y="192" font-family="Arial, sans-serif" font-size="11" fill="#f6ad55" text-anchor="middle">WebSocket</text>
</svg>
