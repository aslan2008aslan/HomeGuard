<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#0d1117" rx="8"/>

  <!-- Flow boxes -->
  <rect x="30" y="160" width="120" height="80" fill="#2b6cb0" rx="8"/>
  <text x="90" y="195" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Natural</text>
  <text x="90" y="215" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Language</text>

  <rect x="180" y="160" width="120" height="80" fill="#2c5282" rx="8"/>
  <text x="240" y="195" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Task</text>
  <text x="240" y="215" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Planning</text>

  <rect x="330" y="160" width="120" height="80" fill="#276749" rx="8"/>
  <text x="390" y="195" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Device</text>
  <text x="390" y="215" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Calls</text>

  <rect x="480" y="160" width="120" height="80" fill="#553c9a" rx="8"/>
  <text x="540" y="195" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Visual</text>
  <text x="540" y="215" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Reasoning</text>

  <rect x="630" y="160" width="120" height="80" fill="#9b2c2c" rx="8"/>
  <text x="690" y="195" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Result +</text>
  <text x="690" y="215" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Feedback</text>

  <!-- Arrows -->
  <line x1="150" y1="200" x2="180" y2="200" stroke="#718096" stroke-width="2"/>
  <polygon points="175,195 185,200 175,205" fill="#718096"/>

  <line x1="300" y1="200" x2="330" y2="200" stroke="#718096" stroke-width="2"/>
  <polygon points="325,195 335,200 325,205" fill="#718096"/>

  <line x1="450" y1="200" x2="480" y2="200" stroke="#718096" stroke-width="2"/>
  <polygon points="475,195 485,200 475,205" fill="#718096"/>

  <line x1="600" y1="200" x2="630" y2="200" stroke="#718096" stroke-width="2"/>
  <polygon points="625,195 635,200 625,205" fill="#718096"/>

  <!-- Feedback loop arrow -->
  <path d="M 690 240 L 690 310 L 240 310 L 240 240" fill="none" stroke="#f6ad55" stroke-width="2" stroke-dasharray="6,3"/>
  <polygon points="235,245 240,235 245,245" fill="#f6ad55"/>
  <text x="465" y="335" font-family="Arial, sans-serif" font-size="12" fill="#f6ad55" text-anchor="middle">Self-correction loop (retry on low confidence)</text>

  <!-- Labels -->
  <text x="90" y="270" font-family="Arial, sans-serif" font-size="10" fill="#a0aec0" text-anchor="middle">"Check the plant"</text>
  <text x="240" y="270" font-family="Arial, sans-serif" font-size="10" fill="#a0aec0" text-anchor="middle">LLM plans steps</text>
  <text x="390" y="270" font-family="Arial, sans-serif" font-size="10" fill="#a0aec0" text-anchor="middle">MHS protocol</text>
  <text x="540" y="270" font-family="Arial, sans-serif" font-size="10" fill="#a0aec0" text-anchor="middle">Image → judgment</text>
  <text x="690" y="270" font-family="Arial, sans-serif" font-size="10" fill="#a0aec0" text-anchor="middle">Confidence + evidence</text>

  <!-- Title -->
  <text x="400" y="50" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#e2e8f0" text-anchor="middle">HomeGuard Task Execution Flow</text>
  <text x="400" y="80" font-family="Arial, sans-serif" font-size="13" fill="#a0aec0" text-anchor="middle">From natural language input to autonomous inspection output</text>

  <!-- AGH label -->
  <rect x="160" y="100" width="480" height="30" fill="none" stroke="#4a5568" stroke-width="1" stroke-dasharray="4,2" rx="4"/>
  <text x="400" y="120" font-family="Arial, sans-serif" font-size="11" fill="#718096" text-anchor="middle">Agnes Harness execution runtime</text>
</svg>
